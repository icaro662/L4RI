name: Deploy to Oracle

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/projects/L4RI/docker
            git pull
              echo "FLUXER_BOT_TOKEN=${{ secrets.FLUXER_BOT_TOKEN }}" > ~/projects/L4RI/config/.env
              echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> ~/projects/L4RI/config/.env
              echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> ~/projects/L4RI/config/.env
              echo "ITAD_API_KEY=${{ secrets.ITAD_API_KEY }}" >> ~/projects/L4RI/config/.env
              echo "BRAVE_API_KEY=${{ secrets.BRAVE_API_KEY }}" >> ~/projects/L4RI/config/.env
              echo "CLIENT_ID=${{ vars.CLIENT_ID }}" >> ~/projects/L4RI/config/.env
              echo "TARGET_GAMESNOT_CHANNEL_ID=${{ vars.TARGET_GAMESNOT_CHANNEL_ID }}" >> ~/projects/L4RI/config/.env
              echo "TARGET_GUILD_ID=${{ vars.TARGET_GUILD_ID }}" >> ~/projects/L4RI/config/.env
              echo "INSTAGRAM_USERNAME=${{ secrets.INSTAGRAM_USERNAME }}" >> ~/projects/L4RI/config/.env
              echo "INSTAGRAM_PASSWORD=${{ secrets.INSTAGRAM_PASSWORD }}" >> ~/projects/L4RI/config/.env
            docker compose up -d --build bot